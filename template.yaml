AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CareCircle - Breast Cancer Screening & Care Coordination Agent
  Serverless deployment on AWS Lambda + API Gateway

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.10
    Environment:
      Variables:
        AWS_REGION_NAME: !Ref AWS::Region
        BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-20250514

Resources:
  CareCircleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: carecircle-api
      Description: CareCircle Breast Cancer Screening Agent API
      Handler: dashboard_handler.handler
      CodeUri: lambda_app/
      Architectures:
        - x86_64
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref CareCircleApi
        RootPath:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref CareCircleApi

  CareCircleApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - "*"

Outputs:
  CareCircleApiUrl:
    Description: "CareCircle API Gateway URL"
    Value: !Sub "https://${CareCircleApi}.execute-api.${AWS::Region}.amazonaws.com/"
  
  CareCircleFunctionArn:
    Description: "CareCircle Lambda Function ARN"
    Value: !GetAtt CareCircleFunction.Arn
